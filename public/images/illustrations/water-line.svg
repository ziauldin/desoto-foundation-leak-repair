    <path d="M122 210V270H184V210" fill="none"/>
    <rect x="116" y="200" width="74" height="10" rx="2" fill="#f6f4ef"/>
    <rect x="140" y="202" width="26" height="6" rx="1" fill="#132636" stroke="none"/>
    <path d="M128 252H178" stroke="#132636" stroke-width="12" stroke-linecap="round"/>
    <path d="M128 252H178" stroke="#d9922e" stroke-width="6" stroke-linecap="round"/>
    <circle cx="153" cy="248" r="13" fill="#1e3a52"/>
    <circle cx="153" cy="248" r="7" fill="#a9c7e0" stroke-width="2"/>
    <path d="M153 248l4-4" stroke-width="2" stroke-linecap="round"/>
