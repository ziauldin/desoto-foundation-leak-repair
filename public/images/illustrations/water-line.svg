  <g transform="translate(506 208) scale(1.12) translate(-516 -208)" stroke="#132636" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect x="432" y="196" width="168" height="12" fill="#f6f4ef"/>
    <rect x="442" y="126" width="148" height="70" fill="url(#brick)"/>
    <path d="M424 130L516 72L608 130Z" fill="#1e3a52"/>
    <rect x="420" y="126" width="192" height="8" rx="2" fill="#132636"/>
    <rect x="530" y="148" width="30" height="48" fill="#2d5577"/>
    <circle cx="553" cy="174" r="2.5" fill="#d9922e" stroke="none"/>
    <rect x="458" y="148" width="48" height="30" fill="#a9c7e0"/>
    <path d="M482 148V178M458 163H506" stroke="#ffffff" stroke-width="3"/>
    <rect x="454" y="178" width="56" height="6" fill="#f6f4ef"/>
    <circle cx="516" cy="104" r="9" fill="#f6e7cf"/>
  </g>
  <path d="M408 204a12 12 0 0 1 2-16 14 14 0 0 1 22 0 10 10 0 0 1 4 16Z" fill="#7d9467" stroke="#132636" stroke-width="3" stroke-linejoin="round"/>

  <rect x="20" y="20" width="600" height="380" rx="28" fill="none" stroke="#d8d2c6" stroke-width="2"/>
