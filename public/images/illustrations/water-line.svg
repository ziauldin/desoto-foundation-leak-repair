  <g fill="#5b8db8" stroke="#132636" stroke-width="1.5">
    <use href="#drop" transform="translate(290 274)"/>
    <use href="#drop" transform="translate(272 286) scale(.8)"/>
    <use href="#drop" transform="translate(308 286) scale(.8)"/>
    <use href="#drop" transform="translate(290 298) scale(.65)"/>
    <use href="#drop" transform="translate(270 238) scale(.65)"/>
    <use href="#drop" transform="translate(312 238) scale(.65)"/>
  </g>

  <!-- tree -->
  <g transform="translate(336 206) scale(1.2) translate(-380 -206)" stroke="#132636" stroke-width="3" stroke-linejoin="round">
    <rect x="374" y="150" width="12" height="56" fill="#8a6b4e"/>
    <path d="M346 150a26 26 0 0 1 10-42 32 32 0 0 1 52 0 26 26 0 0 1 8 42Z" fill="#5f7550"/>
    <path d="M370 118a14 14 0 0 1 22-6" fill="none" stroke="#7d9467" stroke-width="3" stroke-linecap="round"/>
  </g>

