<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t">
  <title id="t">Foundation inspection tools laid out over a slab floor plan: a clipboard checklist, a tripod laser level casting a beam to a grade rod, a tape measure, and a grid of elevation reading points</title>

  <rect x="20" y="20" width="600" height="380" rx="28" fill="#ece8e0"/>

  <!-- slab thickness faces -->
  <g stroke="#132636" stroke-width="3" stroke-linejoin="round">
    <path d="M136 343.5H476V358H136Z" fill="#d8d2c6"/>
    <path d="M476 343.5L576 206V220.5L476 358Z" fill="#c9ad8f"/>
  </g>

  <!-- floor plan (oblique) -->
  <g transform="matrix(1 0 -0.4 0.55 236 206)" stroke-linejoin="round" stroke-linecap="round">
    <rect width="340" height="250" fill="#f6f4ef" stroke="#132636" stroke-width="3" vector-effect="non-scaling-stroke"/>
    <path d="M150 0V48M150 96V140H62M24 140H0M150 140H200M244 140H340M250 140V250" fill="none" stroke="#2d5577" stroke-width="4" vector-effect="non-scaling-stroke"/>
    <rect x="160" y="128" width="172" height="112" rx="44" fill="#f6e7cf" stroke="#d9922e" stroke-width="2.5" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>
    <g fill="#2d5577">
      <circle cx="40" cy="35" r="8"/><circle cx="110" cy="35" r="8"/><circle cx="180" cy="35" r="8"/><circle cx="250" cy="35" r="8"/><circle cx="310" cy="35" r="8"/>
      <circle cx="40" cy="95" r="8"/><circle cx="110" cy="95" r="8"/><circle cx="180" cy="95" r="8"/><circle cx="250" cy="95" r="8"/><circle cx="310" cy="95" r="8"/>
      <circle cx="40" cy="155" r="8"/><circle cx="110" cy="155" r="8"/>
      <circle cx="40" cy="215" r="8"/><circle cx="110" cy="215" r="8"/>
    </g>
    <g fill="#d9922e" stroke="#132636" stroke-width="2" vector-effect="non-scaling-stroke">
      <circle cx="180" cy="155" r="9"/><circle cx="250" cy="155" r="9"/><circle cx="310" cy="155" r="9"/>
      <circle cx="180" cy="215" r="9"/><circle cx="250" cy="215" r="9"/><circle cx="310" cy="215" r="9"/>
    </g>
  </g>

  <!-- tripod laser level -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M228 186L190 316M228 186L268 316M228 186L238 292" fill="none" stroke="#132636" stroke-width="7"/>
    <path d="M228 186L190 316M228 186L268 316M228 186L238 292" fill="none" stroke="#5c6b73" stroke-width="3"/>
    <g stroke="#132636" stroke-width="3">
      <rect x="212" y="176" width="32" height="10" rx="2" fill="#1e3a52"/>
      <rect x="218" y="132" width="20" height="14" rx="2" fill="#2d5577"/>
      <rect x="204" y="144" width="48" height="32" rx="5" fill="#d9922e"/>
      <rect x="212" y="152" width="32" height="14" rx="2" fill="#132636"/>
    </g>
    <path d="M252 159H441" stroke="#d9922e" stroke-width="3"/>
    <path d="M258 151L266 147M258 167L266 171" stroke="#d9922e" stroke-width="2.5"/>
  </g>

  <!-- grade rod on a reading point -->
  <g stroke="#132636" stroke-width="3" stroke-linejoin="round">
    <rect x="441" y="112" width="14" height="146" fill="#ffffff"/>
    <path d="M442.5 114H453.5V134H442.5ZM442.5 154H453.5V174H442.5ZM442.5 194H453.5V214H442.5ZM442.5 234H453.5V256H442.5Z" fill="#d9922e" stroke="none"/>
    <rect x="441" y="112" width="14" height="146" fill="none"/>
    <rect x="435" y="152" width="26" height="14" rx="3" fill="#1e3a52"/>
    <path d="M440 159H456" stroke="#d9922e" stroke-width="2.5"/>
  </g>

  <!-- tape measure -->
  <g stroke="#132636" stroke-linejoin="round">
    <rect x="298" y="345" width="186" height="11" fill="#f6e7cf" stroke-width="2"/>
    <path d="M310 345V351M320 345V349M330 345V349M340 345V351M350 345V349M360 345V351M370 345V349M380 345V349M390 345V351M400 345V349M410 345V351M420 345V349M430 345V349M440 345V351M450 345V349M460 345V351" stroke-width="1.5"/>
    <rect x="292" y="340" width="7" height="21" rx="1.5" fill="#5c6b73" stroke-width="2"/>
    <rect x="476" y="318" width="62" height="58" rx="14" fill="#b5761c" stroke="none" transform="translate(4 4)"/>
    <rect x="476" y="318" width="62" height="58" rx="14" fill="#d9922e" stroke-width="3"/>
    <circle cx="507" cy="347" r="15" fill="#1e3a52" stroke-width="3"/>
    <circle cx="507" cy="347" r="5" fill="#d9922e" stroke-width="2"/>
    <rect x="470" y="342" width="10" height="16" rx="2" fill="#132636" stroke-width="2"/>
  </g>

  <!-- clipboard checklist -->
  <g transform="rotate(-6 112 140)" stroke="#132636" stroke-linejoin="round" stroke-linecap="round">
    <rect x="52" y="56" width="128" height="172" rx="8" fill="#8f6a43" stroke="none" transform="translate(5 5)"/>
    <rect x="52" y="56" width="128" height="172" rx="8" fill="#b98c5a" stroke-width="3"/>
    <rect x="62" y="72" width="108" height="146" rx="2" fill="#ffffff" stroke-width="3"/>
    <rect x="92" y="48" width="48" height="20" rx="5" fill="#5c6b73" stroke-width="3"/>
    <circle cx="116" cy="52" r="4" fill="#ece8e0" stroke-width="2"/>
    <g fill="#ffffff" stroke-width="2">
      <rect x="72" y="88" width="13" height="13" rx="2"/><rect x="72" y="114" width="13" height="13" rx="2"/>
      <rect x="72" y="140" width="13" height="13" rx="2"/><rect x="72" y="166" width="13" height="13" rx="2"/>
      <rect x="72" y="192" width="13" height="13" rx="2"/>
    </g>
    <path d="M74 94L78 99L88 86M74 120L78 125L88 112M74 146L78 151L88 138" fill="none" stroke="#d9922e" stroke-width="3"/>
    <path d="M94 95H156M94 121H146M94 147H158M94 173H150M94 199H140" fill="none" stroke="#d8d2c6" stroke-width="4"/>
  </g>
</svg>
