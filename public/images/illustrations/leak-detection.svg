<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t">
  <title id="t">Acoustic leak detection: a disc sensor on a tile floor wired to a handheld listening unit, with sound waves rising from a hidden pipe leak marked by a location pin</title>
  <defs>
    <clipPath id="bd"><rect x="20" y="20" width="600" height="380" rx="28"/></clipPath>
    <clipPath id="below"><rect x="20" y="222" width="600" height="170"/></clipPath>
    <path id="drop" d="M0-7C2.5-3 5 0 5 3A5 5 0 0 1-5 3C-5 0-2.5-3 0-7Z"/>
  </defs>

  <g clip-path="url(#bd)">
    <rect x="20" y="20" width="600" height="380" fill="#ece8e0"/>
    <!-- wall + baseboard -->
    <rect x="20" y="20" width="600" height="180" fill="#f6f4ef"/>
    <rect x="20" y="186" width="600" height="14" fill="#ffffff" stroke="#d8d2c6" stroke-width="2"/>
    <g stroke="#132636" stroke-width="3" stroke-linejoin="round">
      <rect x="76" y="56" width="104" height="84" fill="#a9c7e0"/>
      <path d="M128 56V140M76 98H180" stroke="#ffffff" stroke-width="5"/>
      <rect x="70" y="140" width="116" height="8" fill="#ffffff"/>
    </g>
    <path d="M88 86l18-18M88 100l30-30M140 124l26-26" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- tile floor -->
    <rect x="10" y="200" width="620" height="20" fill="#ece8e0" stroke="#132636" stroke-width="3"/>
    <path d="M70 200V220M150 200V220M230 200V220M310 200V220M390 200V220M470 200V220M550 200V220" stroke="#d8d2c6" stroke-width="2"/>

    <!-- slab -->
    <rect x="10" y="220" width="620" height="56" fill="#f6f4ef" stroke="#132636" stroke-width="3"/>
    <g fill="#d8d2c6">
      <circle cx="50" cy="240" r="3"/><circle cx="96" cy="262" r="2.5"/><circle cx="150" cy="236" r="2"/>
      <circle cx="420" cy="258" r="3"/><circle cx="480" cy="236" r="2.5"/><circle cx="530" cy="262" r="3"/>
      <circle cx="590" cy="244" r="2"/>
    </g>

    <!-- soil -->
    <rect x="10" y="276" width="620" height="130" fill="#a98463" stroke="#132636" stroke-width="3"/>
    <g fill="#c9ad8f">
      <ellipse cx="60" cy="300" rx="6" ry="3.5"/><ellipse cx="110" cy="370" rx="5" ry="3"/>
      <ellipse cx="460" cy="372" rx="6" ry="3.5"/><ellipse cx="560" cy="300" rx="5" ry="3"/>
      <ellipse cx="520" cy="356" rx="4" ry="2.5"/><ellipse cx="400" cy="384" rx="5" ry="3"/>
    </g>
    <path d="M206 330C200 306 226 298 250 300C278 298 302 310 296 334C292 356 270 372 250 372C228 372 210 352 206 330Z" fill="#8a6b4e"/>

    <!-- hidden pipe (dashed) -->
    <rect x="0" y="310" width="640" height="16" fill="#d8d2c6"/>
    <path d="M10 310H630M10 326H630" stroke="#132636" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>
  </g>

  <!-- leak at pipe -->
  <circle cx="250" cy="318" r="5" fill="#5b8db8" stroke="#132636" stroke-width="2"/>
  <g fill="#5b8db8" stroke="#132636" stroke-width="1.5">
    <use href="#drop" transform="translate(236 344) scale(.75)"/>
    <use href="#drop" transform="translate(262 348) scale(.75)"/>
    <use href="#drop" transform="translate(250 360) scale(.6)"/>
  </g>

  <!-- sound waves -->
  <g clip-path="url(#below)" fill="none" stroke-linecap="round">
    <path d="M221.8 307.7A30 30 0 0 1 278.2 307.7" stroke="#d9922e" stroke-width="3.5"/>
    <path d="M199.3 299.5A54 54 0 0 1 300.7 299.5" stroke="#d9922e" stroke-width="3.5"/>
    <path d="M176.7 291.3A78 78 0 0 1 323.3 291.3" stroke="#d9922e" stroke-width="3"/>
    <path d="M154.2 283.1A102 102 0 0 1 345.8 283.1" stroke="#b5761c" stroke-width="3" stroke-dasharray="14 8"/>
    <path d="M131.6 274.9A126 126 0 0 1 368.4 274.9" stroke="#b5761c" stroke-width="2.5" stroke-dasharray="8 10"/>
  </g>

  <!-- location pin on floor above leak -->
  <g stroke="#132636" stroke-width="3" stroke-linejoin="round">
    <ellipse cx="250" cy="200" rx="14" ry="3.5" fill="#d8d2c6" stroke="none"/>
    <path d="M250 199C242 186 234 178 234 168A16 16 0 0 1 266 168C266 178 258 186 250 199Z" fill="#d9922e"/>
    <circle cx="250" cy="168" r="6" fill="#ffffff"/>
  </g>

  <!-- disc sensor -->
  <g stroke="#132636" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M346 200V192H402V200Z" fill="#132636"/>
    <path d="M352 192C356 176 392 176 396 192Z" fill="#2d5577"/>
    <path d="M366 180H382" stroke="#d9922e" stroke-width="3"/>
    <path d="M374 177V168C374 150 400 144 426 150" fill="none"/>
  </g>
  <path d="M359 197H389" stroke="#5c6b73" stroke-width="2" stroke-linecap="round"/>

  <!-- cable -->
  <path d="M426 150C452 156 456 186 470 192" fill="none" stroke="#132636" stroke-width="3" stroke-linecap="round"/>

  <!-- handheld unit -->
  <g stroke="#132636" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M490 108C490 88 548 88 548 108" fill="none" stroke-width="8"/>
    <path d="M490 108C490 88 548 88 548 108" fill="none" stroke="#5c6b73" stroke-width="3"/>
    <rect x="466" y="104" width="106" height="96" rx="12" fill="#1e3a52"/>
    <rect x="480" y="116" width="78" height="44" rx="4" fill="#a9c7e0"/>
    <path d="M486 140H500L505 130L510 150L516 122L522 156L528 132L533 140H552" fill="none" stroke="#132636" stroke-width="2.5"/>
    <circle cx="492" cy="180" r="7" fill="#d9922e"/>
    <circle cx="516" cy="180" r="7" fill="#f6f4ef"/>
    <rect x="532" y="174" width="26" height="12" rx="3" fill="#2d5577"/>
    <rect x="474" y="200" width="18" height="4" rx="2" fill="#132636" stroke="none"/>
    <rect x="546" y="200" width="18" height="4" rx="2" fill="#132636" stroke="none"/>
  </g>
  <circle cx="470" cy="192" r="4" fill="#132636"/>

  <rect x="20" y="20" width="600" height="380" rx="28" fill="none" stroke="#d8d2c6" stroke-width="2"/>
</svg>
