<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t">
  <title id="t">Burst pipe joint spraying water onto a spreading floor puddle, with the main shutoff valve wheel and an arrow showing the direction to turn it closed</title>
  <defs>
    <clipPath id="bd"><rect x="20" y="20" width="600" height="380" rx="28"/></clipPath>
    <path id="drop" d="M0-7C2.5-3 5 0 5 3A5 5 0 0 1-5 3C-5 0-2.5-3 0-7Z"/>
  </defs>

  <g clip-path="url(#bd)">
    <rect x="20" y="20" width="600" height="380" fill="#ece8e0"/>
    <!-- baseboard + floor -->
    <rect x="10" y="296" width="620" height="22" fill="#ffffff" stroke="#d8d2c6" stroke-width="2"/>
    <rect x="10" y="318" width="620" height="92" fill="#f6f4ef" stroke="#132636" stroke-width="3"/>
    <path d="M10 346H630M10 380H630M96 318L80 410M216 318L208 410M336 318V410M456 318L464 410M576 318L592 410" stroke="#d8d2c6" stroke-width="2"/>
  </g>

  <!-- puddle -->
  <path d="M236 340C258 324 330 330 378 327C434 323 520 328 540 344C560 360 500 370 446 366C400 374 300 374 260 362C232 354 222 348 236 340Z" fill="#a9c7e0" stroke="#5b8db8" stroke-width="3" stroke-linejoin="round"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
    <ellipse cx="380" cy="344" rx="34" ry="7"/>
    <ellipse cx="380" cy="344" rx="16" ry="3"/>
    <path d="M276 350h22M470 354h24"/>
  </g>

  <!-- pipe run -->
  <g fill="none" stroke-linejoin="round">
    <path d="M150 324V150H500V324" stroke="#132636" stroke-width="21"/>
    <path d="M150 324V150H500V324" stroke="#d9922e" stroke-width="15"/>
    <path d="M146 300V146H496M504 160V300" stroke="#f6e7cf" stroke-width="3"/>
  </g>
  <g fill="#d8d2c6" stroke="#132636" stroke-width="3" stroke-linejoin="round">
    <rect x="128" y="312" width="44" height="8" rx="2"/>
    <rect x="478" y="312" width="44" height="8" rx="2"/>
  </g>

  <!-- burst coupling -->
  <g stroke="#132636" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect x="364" y="134" width="14" height="32" rx="2" fill="#b5761c"/>
    <rect x="386" y="134" width="14" height="32" rx="2" fill="#b5761c"/>
    <path d="M378 140L384 146L380 152L386 158L382 164" fill="none" stroke-width="2.5"/>
  </g>

  <!-- spray -->
  <g fill="none" stroke="#a9c7e0" stroke-width="3" stroke-linecap="round">
    <path d="M340 184l-12 6M424 184l12 6M326 214l-12 4M438 214l12 4M352 120l-12-4M412 120l12-4"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <g stroke="#132636" stroke-width="7">
      <path d="M380 166C356 176 334 200 318 236"/>
      <path d="M382 168C370 196 362 226 358 262"/>
      <path d="M384 168C398 196 406 226 408 262"/>
      <path d="M386 166C412 176 432 200 446 236"/>
      <path d="M380 136C368 116 352 104 334 98"/>
      <path d="M386 136C398 116 414 104 432 98"/>
    </g>
    <g stroke="#5b8db8" stroke-width="3.5">
      <path d="M380 166C356 176 334 200 318 236"/>
      <path d="M382 168C370 196 362 226 358 262"/>
      <path d="M384 168C398 196 406 226 408 262"/>
      <path d="M386 166C412 176 432 200 446 236"/>
      <path d="M380 136C368 116 352 104 334 98"/>
      <path d="M386 136C398 116 414 104 432 98"/>
    </g>
  </g>
  <g fill="#5b8db8" stroke="#132636" stroke-width="1.5">
    <use href="#drop" transform="translate(312 258) scale(.8)"/>
    <use href="#drop" transform="translate(356 286) scale(.8)"/>
    <use href="#drop" transform="translate(410 286) scale(.8)"/>
    <use href="#drop" transform="translate(452 258) scale(.8)"/>
    <use href="#drop" transform="translate(384 304) scale(.7)"/>
    <use href="#drop" transform="translate(320 92) scale(.6) rotate(-60)"/>
    <use href="#drop" transform="translate(446 92) scale(.6) rotate(60)"/>
  </g>
  <g fill="#a9c7e0">
    <circle cx="336" cy="250" r="3"/><circle cx="430" cy="250" r="3"/><circle cx="296" cy="218" r="2.5"/>
    <circle cx="468" cy="218" r="2.5"/><circle cx="384" cy="232" r="3"/><circle cx="350" cy="84" r="2.5"/>
    <circle cx="416" cy="84" r="2.5"/>
  </g>

  <!-- main shutoff valve -->
  <g stroke="#132636" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect x="130" y="210" width="40" height="52" rx="6" fill="#5c6b73"/>
    <circle cx="150" cy="236" r="30" fill="#2d5577" stroke="none"/>
    <path d="M126 210H174M126 262H174" stroke-width="5"/>
    <circle cx="150" cy="236" r="34" fill="none" stroke-width="15"/>
    <circle cx="150" cy="236" r="34" fill="none" stroke="#d9922e" stroke-width="9"/>
    <path d="M150 205V267M119 236H181" stroke-width="5"/>
    <circle cx="150" cy="236" r="10" fill="#1e3a52"/>
    <circle cx="150" cy="236" r="3.5" fill="#f6f4ef" stroke="none"/>
  </g>
  
  <!-- turn arrow (clockwise to close) -->
  <path d="M167.1 189A50 50 0 0 1 197.7 251.2" fill="none" stroke="#1e3a52" stroke-width="5" stroke-linecap="round"/>
  <path d="M193.6 262.5L205 253.8L189.8 248.2Z" fill="#1e3a52" stroke="#1e3a52" stroke-width="3" stroke-linejoin="round"/>

  <rect x="20" y="20" width="600" height="380" rx="28" fill="none" stroke="#d8d2c6" stroke-width="2"/>
</svg>
