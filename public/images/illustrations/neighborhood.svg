<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
  <title>A DeSoto residential street with three single-story brick ranch homes, mature shade trees, a sidewalk and a curb</title>
  <defs>
    <clipPath id="nb-bg"><rect x="20" y="20" width="600" height="380" rx="32"/></clipPath>
    <pattern id="nb-brick" width="24" height="14" patternUnits="userSpaceOnUse">
      <rect width="24" height="14" fill="#c9a27a"/>
      <path d="M0 6.5h24M0 13.5h24M12 0v6.5M0 7v7M24 7v7" stroke="#ece8e0" stroke-width="1.5"/>
    </pattern>
    <pattern id="nb-brick2" width="24" height="14" patternUnits="userSpaceOnUse">
      <rect width="24" height="14" fill="#c9ad8f"/>
      <path d="M0 6.5h24M0 13.5h24M12 0v6.5M0 7v7M24 7v7" stroke="#f6f4ef" stroke-width="1.5"/>
    </pattern>
    <g id="nb-tree">
      <path d="M0 0V-90" fill="none" stroke="#132636" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0 0V-90" fill="none" stroke="#b98c5a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <g stroke="#132636" stroke-width="6"><circle cx="0" cy="-122" r="46"/><circle cx="-34" cy="-90" r="30"/><circle cx="34" cy="-88" r="30"/></g>
      <g fill="#7d9467"><circle cx="0" cy="-122" r="46"/><circle cx="-34" cy="-90" r="30"/><circle cx="34" cy="-88" r="30"/></g>
    </g>
  </defs>
  <rect x="20" y="20" width="600" height="380" rx="32" fill="#ece8e0"/>
  <g clip-path="url(#nb-bg)">
    <circle cx="560" cy="70" r="24" fill="#f6e7cf"/>
    <path d="M86 84h86a16 16 0 0 0-12-28 24 24 0 0 0-44-8 18 18 0 0 0-30 36z" fill="#f6f4ef"/>
    <!-- lawns -->
    <rect x="0" y="252" width="640" height="52" fill="#7d9467"/>
    <path d="M0 252H640" stroke="#5f7550" stroke-width="3"/>
    <!-- trees behind -->
    <use href="#nb-tree" x="30" y="256"/>
    <use href="#nb-tree" x="222" y="262"/>
    <use href="#nb-tree" x="420" y="262"/>
    <use href="#nb-tree" x="606" y="258"/>
    <!-- sidewalk, parkway, curb, street -->
    <rect x="0" y="302" width="640" height="18" fill="#f6f4ef" stroke="#132636" stroke-width="3"/>
    <path d="M60 304v14M140 304v14M220 304v14M300 304v14M380 304v14M460 304v14M540 304v14" stroke="#d8d2c6" stroke-width="3"/>
    <rect x="0" y="320" width="640" height="12" fill="#7d9467"/>
    <rect x="0" y="332" width="640" height="10" fill="#d8d2c6" stroke="#132636" stroke-width="3"/>
    <rect x="0" y="342" width="640" height="80" fill="#5c6b73"/>
    <path d="M40 378h44M140 378h44M240 378h44M340 378h44M440 378h44M540 378h44" stroke="#f6e7cf" stroke-width="5" stroke-linecap="round"/>
    <!-- driveways -->
    <g fill="#f6f4ef" stroke="#132636" stroke-width="3" stroke-linejoin="round">
      <path d="M140 262H186L190 302H136z"/><path d="M134 320H192V332H134z"/>
      <path d="M454 262H500L504 302H450z"/><path d="M448 320H506V332H448z"/>
    </g>
  </g>

  <!-- house A: hip roof, garage right -->
  <g stroke="#132636" stroke-width="3" stroke-linejoin="round">
    <rect x="44" y="250" width="156" height="12" fill="#f6f4ef"/>
    <rect x="52" y="196" width="140" height="54" fill="url(#nb-brick)"/>
    <path d="M38 198L74 162H170L206 198z" fill="#1e3a52"/>
    <rect x="38" y="196" width="168" height="7" fill="#ffffff"/>
    <rect x="62" y="214" width="34" height="24" fill="#a9c7e0"/>
    <path d="M79 214v24" fill="none"/>
    <rect x="106" y="214" width="18" height="36" fill="#d9922e"/>
    <rect x="136" y="212" width="52" height="38" fill="#f6f4ef"/>
    <path d="M136 225H188M136 238H188" fill="none" stroke="#d8d2c6"/>
    <rect x="136" y="212" width="52" height="38" fill="none"/>
  </g>

  <!-- house B: side gable with front entry gable -->
  <g stroke="#132636" stroke-width="3" stroke-linejoin="round">
    <rect x="244" y="250" width="152" height="12" fill="#f6f4ef"/>
    <rect x="252" y="194" width="136" height="56" fill="url(#nb-brick2)"/>
    <path d="M238 198L264 156H376L402 198z" fill="#2d5577"/>
    <rect x="238" y="196" width="164" height="7" fill="#ffffff"/>
    <path d="M296 206L320 176L344 206z" fill="#2d5577"/>
    <path d="M304 204L320 186L336 204z" fill="#f6f4ef"/>
    <rect x="262" y="214" width="26" height="24" fill="#a9c7e0"/>
    <rect x="352" y="214" width="26" height="24" fill="#a9c7e0"/>
    <path d="M275 214v24M365 214v24" fill="none"/>
    <rect x="300" y="206" width="40" height="44" fill="#f6f4ef"/>
    <rect x="311" y="214" width="18" height="36" fill="#1e3a52"/>
    <path d="M300 206h40" fill="none"/>
  </g>
  <path d="M315 262H325L327 302H313z" fill="#f6f4ef" stroke="#132636" stroke-width="3" stroke-linejoin="round"/>

  <!-- house C: hip roof, garage gable left -->
  <g stroke="#132636" stroke-width="3" stroke-linejoin="round">
    <rect x="440" y="250" width="160" height="12" fill="#f6f4ef"/>
    <rect x="448" y="198" width="144" height="52" fill="url(#nb-brick)"/>
    <path d="M436 200L470 166H570L604 200z" fill="#5c6b73"/>
    <rect x="436" y="198" width="168" height="7" fill="#ffffff"/>
    <path d="M440 206L477 170L514 206z" fill="#5c6b73"/>
    <path d="M452 204L477 182L502 204z" fill="#f6f4ef"/>
    <rect x="450" y="214" width="54" height="36" fill="#f6f4ef"/>
    <path d="M450 226H504M450 238H504" fill="none" stroke="#d8d2c6"/>
    <rect x="450" y="214" width="54" height="36" fill="none"/>
    <rect x="516" y="214" width="16" height="36" fill="#b5761c"/>
    <rect x="542" y="214" width="38" height="24" fill="#a9c7e0"/>
    <path d="M561 214v24" fill="none"/>
  </g>
  <!-- shrubs -->
  <g fill="#5f7550" stroke="#132636" stroke-width="3" stroke-linejoin="round">
    <path d="M56 250a10 10 0 0 1 18-6a10 10 0 0 1 18 0a10 10 0 0 1 8 6z"/>
    <path d="M256 250a10 10 0 0 1 18-6a10 10 0 0 1 18 0z"/>
    <path d="M348 250a10 10 0 0 1 18-6a10 10 0 0 1 18 0z"/>
    <path d="M538 250a10 10 0 0 1 18-6a10 10 0 0 1 18 0a10 10 0 0 1 8 6z"/>
  </g>
</svg>
